[project]
name = "mcp-hub"
version = "0.1.0"
description = "Detect and manage MCP servers across AI coding agents"
requires-python = ">=3.11"
dependencies = [
    "textual>=0.60",
    "tomlkit>=0.12",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
mcp-hub = "mcp_hub.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mcp_hub*"]
