[project]
name = "mcp-hub-tui"
version = "0.1.1"
description = "Detect and manage MCP servers across AI coding agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Denis Besfamilnyy", email = "den5149@gmail.com" },
]
keywords = ["mcp", "model-context-protocol", "tui", "claude-code", "codex"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Console :: Curses",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
]
dependencies = [
    "textual>=0.60",
    "tomlkit>=0.12",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/d2202/mcp-hub"
Repository = "https://github.com/d2202/mcp-hub"
Issues = "https://github.com/d2202/mcp-hub/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
mcp-hub = "mcp_hub.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mcp_hub*"]

[tool.setuptools.package-data]
mcp_hub = ["catalog.yaml"]
